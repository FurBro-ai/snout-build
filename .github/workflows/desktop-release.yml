name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: universal-apple-darwin
            bundle: dmg
            artifact: Snout-macOS-universal.dmg
            name: macOS-universal
          - os: windows-latest
            target: ""
            bundle: nsis
            artifact: Snout-Windows-x64-setup.exe
            name: Windows-x64
          - os: ubuntu-24.04
            target: ""
            bundle: appimage
            artifact: Snout-Linux-x86_64.AppImage
            name: Linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: npm ci
      - run: npm run build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build desktop package
        shell: bash
        working-directory: src-tauri
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundle }}"
          else
            cargo tauri build --bundles "${{ matrix.bundle }}"
          fi
      - name: Normalise artifact name
        shell: bash
        run: |
          mkdir -p artifacts
          case "${{ matrix.bundle }}" in
            dmg)
              cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "artifacts/${{ matrix.artifact }}" ;;
            nsis)
              cp src-tauri/target/release/bundle/nsis/*.exe "artifacts/${{ matrix.artifact }}" ;;
            appimage)
              cp src-tauri/target/release/bundle/appimage/*.AppImage "artifacts/${{ matrix.artifact }}" ;;
          esac
          ls -lh artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: snout-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Snout desktop builds for macOS (universal), Windows x64, and Linux x86_64.

            These builds are unsigned: macOS may require right-click → Open on first launch,
            and Windows SmartScreen may ask you to confirm the publisher.
