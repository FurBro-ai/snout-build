# =============================================================================
# Snout / CHORD — nginx reverse proxy
# Installed to /etc/nginx/sites-available/snout.conf by deploy/setup-vps.sh.
#
# Nothing is served from disk: Express serves the Vite `dist/` bundle, /api,
# /uploads and Socket.IO all on 127.0.0.1:3000.
#
# HTTPS: after pointing a DNS A record at this server, run:
#   apt-get install -y certbot python3-certbot-nginx
#   certbot --nginx -d your.domain.example
# (Let's Encrypt does not issue certificates for bare IP addresses, so a
#  domain is required for TLS.)
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream snout_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    # Uncomment if the VPS has a working IPv6 stack:
    # listen [::]:80 default_server;
    # setup-vps.sh rewrites this line from the SERVER_NAME env var.
    server_name snout.cloud www.snout.cloud;

    # Attachments up to 110 MB (100 MB Nitro tier + multipart overhead).
    client_max_body_size 110M;

    access_log /var/log/nginx/snout.access.log;
    error_log  /var/log/nginx/snout.error.log;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --- Security headers ----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # WebRTC (camera/mic/screen) must remain allowed for this origin.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
    # HSTS is only meaningful over HTTPS; uncomment after certbot succeeds.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Socket.IO / WebSocket signalling ------------------------------------
    location /socket.io/ {
        proxy_pass http://snout_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- REST API ------------------------------------------------------------
    location /api/ {
        proxy_pass http://snout_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Uploaded attachments (served by Express, proxied here) --------------
    location /uploads/ {
        proxy_pass http://snout_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Desktop downloads (served directly from this server) ----------------
    location = /downloads/latest.json {
        alias /opt/snout/downloads/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location /downloads/ {
        alias /opt/snout/downloads/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/octet-stream;
    }

    # --- SPA + everything else ----------------------------------------------
    location / {
        proxy_pass http://snout_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# =============================================================================
